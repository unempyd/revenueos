name: demo
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Website to read"
        required: true
        default: "https://unempyd.github.io/revenueos/"
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          url: ${{ inputs.url }}
